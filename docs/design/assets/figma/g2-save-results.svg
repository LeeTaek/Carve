<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360"><defs><linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0EFEA" stop-opacity="0"/><stop offset="1" stop-color="#F0EFEA" stop-opacity="0.95"/></linearGradient></defs><rect x="0" y="0" width="1180" height="360" rx="24" fill="#F0EFEA"/><g id="저장 성공" data-name="저장 성공"><rect x="56" y="110" width="360" height="60" rx="30" fill="#FAF9F6"/><rect x="56" y="110" width="360" height="60" rx="30" fill="none" stroke="#303B36" stroke-width="1" opacity="0.12"/><g transform="translate(78 128) scale(1)" fill="none" stroke="#476550" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><title>확인</title><path d="M4.5 12.5l5 5 10-11"/></g><text x="116" y="147" font-size="15" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">사진에 저장했어요</text></g><text x="56" y="214" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">성공</text><text x="56" y="238" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">사진 앱의 「새기다」 앨범에서 볼 수 있다.</text><g id="사진 권한 거부" data-name="사진 권한 거부"><rect x="452" y="56" width="300" height="234" rx="20" fill="#FAF9F6"/><rect x="452" y="56" width="300" height="234" rx="20" fill="none" stroke="#303B36" stroke-width="1" opacity="0.12"/><text x="602" y="104" font-size="16" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle" font-weight="600">사진 접근이 꺼져 있어요</text><text x="602" y="140" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">설정에서 사진 추가 권한을 켜면</text><text x="602" y="160" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">저장할 수 있어요.</text><path d="M452 206h300" stroke="#303B36" stroke-width="1" opacity="0.12"/><path d="M602 206v84" stroke="#303B36" stroke-width="1" opacity="0.12"/><text x="527" y="254" font-size="15" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">나중에</text><text x="677" y="254" font-size="15" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle" font-weight="600">설정 열기</text></g><text x="452" y="320" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">권한 거부 — 저장을 조용히 실패시키지 않고 어디서 켜는지 말한다.</text><g id="생성 실패" data-name="생성 실패"><rect x="788" y="110" width="300" height="60" rx="30" fill="#FAF9F6"/><rect x="788" y="110" width="300" height="60" rx="30" fill="none" stroke="#303B36" stroke-width="1" opacity="0.12"/><g transform="translate(810 128) scale(1)" fill="none" stroke="#A4453C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><title>경고</title><path d="M12 3.6 1.8 21h20.4zM12 10v5M12 17.6v.1"/></g><text x="848" y="147" font-size="15" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">저장하지 못했어요</text><rect x="976" y="122" width="96" height="36" rx="18" fill="#E4EBE2"/><text x="1024" y="145" font-size="12" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">다시 시도</text></g><text x="788" y="214" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">실패</text><text x="788" y="238" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">사라지는 알림만 두지 않고 다시 시도를 함께 둔다.</text></svg>