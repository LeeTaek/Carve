 Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">필사 화면을 정리했어요</text><text x="368" y="284" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">도구 팔레트가 아래로 내려가고, 쓰지 않을 땐 접혀요.</text><path d="M368 312h444" stroke="#303B36" stroke-width="1" opacity="0.07" /><text x="368" y="354" font-size="15" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">절을 길게 눌러보세요</text><text x="368" y="380" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">이전 필사·이미지 저장·위젯·지우기를 한 자리에서.</text><path d="M368 408h444" stroke="#303B36" stroke-width="1" opacity="0.07" /><text x="368" y="450" font-size="15" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">필사를 이미지로 남겨요</text><text x="368" y="476" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">본문과 필기를 한 장으로 합쳐 사진에 저장해요.</text><path d="M368 504h444" stroke="#303B36" stroke-width="1" opacity="0.07" /><text x="368" y="546" font-size="15" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">홈 화면 위젯</text><text x="368" y="572" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">쓴 절을 지정하면 그 순간 모습이 위젯에 남아요.</text><path d="M340 630h500" stroke="#303B36" stroke-width="1" opacity="0.10" /><text x="470" y="682" font-size="15" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">도움말 보기</text><path d="M590 630v90" stroke="#303B36" stroke-width="1" opacity="0.10" /><text x="710" y="682" font-size="15" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">닫기</text></g></svg>