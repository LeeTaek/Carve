ly="Noto Serif KR, AppleMyungjo, serif">그가 나를 푸른 초장에 누이시며</text><path d="M620 355h516" stroke="#DFE2DB" /><text x="78" y="390" font-size="20" fill="#303B36" font-family="Noto Serif KR, AppleMyungjo, serif">쉴 만한 물 가으로 인도하시는도다</text><path d="M620 403h516" stroke="#DFE2DB" /><text x="44" y="462" font-size="13" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">03</text><text x="78" y="462" font-size="20" fill="#303B36" font-family="Noto Serif KR, AppleMyungjo, serif">내 영혼을 소생시키시고 자기 이름을</text><path d="M620 475h516" stroke="#DFE2DB" /><text x="78" y="510" font-size="20" fill="#303B36" font-family="Noto Serif KR, AppleMyungjo, serif">위하여 의의 길로 인도하시는도다</text><path d="M620 523h516" stroke="#DFE2DB" /><text x="44" y="582" font-size="13" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">04</text><text x="78" y="582" font-size="20" fill="#303B36" font-family="Noto Serif KR, AppleMyungjo, serif">내가 사망의 음침한 골짜기로 다닐지라도</text><path d="M620 595h516" stroke="#DFE2DB" /><text x="78" y="630" font-size="20" fill="#303B36" font-family="Noto Serif KR, AppleMyungjo, serif">해를 두려워하지 않을 것은 주께서 나와</text><path d="M620 643h516" stroke="#DFE2DB" /><text x="78" y="678" font-size="20" fill="#303B36" font-family="Noto Serif KR, AppleMyungjo, serif">함께 하심이라 주의 지팡이와 막대기가</text><path d="M620 691h516" stroke="#DFE2DB" /></g><g id="축소 팔레트" data-name="축소 팔레트"><g id="surface-g703" data-name="표면 (불투명 · iOS 26 미만 폴백 · 유리로 쓰려면 채우기 80% + Background blur 20)"><path d="M56 742a32 32 0 1 0 64 0a32 32 0 1 0 -64 0z" fill="#F0EFEA" /></g><g id="hl-g703" data-name="유리 하이라이트 (iOS 26)"><path d="M56 742a32 32 0 1 0 64 0a32 32 0 1 0 -64 0z" fill="url(#spec)" /><path d="M56 742a32 32 0 1 0 64 0a32 32 0 1 0 -64 0z" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.65" /><path d="M56 742a32 32 0 1 0 64 0a32 32 0 1 0 -64 0z" fill="none" stroke="#303B36" stroke-width="1" opacity="0.10" /></g><g transform="translate(76 730) scale(1)" fill="none" stroke="#303B36" stroke