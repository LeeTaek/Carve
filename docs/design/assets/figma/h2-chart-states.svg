<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420"><defs><linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0EFEA" stop-opacity="0"/><stop offset="1" stop-color="#F0EFEA" stop-opacity="0.95"/></linearGradient></defs><rect x="0" y="0" width="1180" height="420" rx="24" fill="#F0EFEA"/><rect x="60" y="60" width="480" height="280" rx="20" fill="#FAF9F6"/><rect x="60" y="60" width="480" height="280" rx="20" fill="none" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="300" y="160" font-size="17" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle" font-weight="600">아직 기록이 없어요</text><text x="300" y="192" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">한 절이라도 필사하면 여기에 쌓여요.</text><rect x="220" y="226" width="160" height="44" rx="12" fill="#F0EFEA" opacity="0.72"/><rect x="220" y="226" width="160" height="44" rx="12" fill="none" stroke="#FFFFFF" opacity="0.6"/><text x="300.0" y="253.0" font-size="14" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">필사하러 가기</text><text x="60" y="380" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">빈 상태 — 화면 1/3 을 빈 문장으로 채우지 않고 바로 돌아갈 길을 준다.</text><rect x="600" y="60" width="520" height="280" rx="20" fill="#FAF9F6"/><rect x="600" y="60" width="520" height="280" rx="20" fill="none" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="624" y="94" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">VoiceOver 가 읽는 요약</text><text x="624" y="130" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">「차트. 9월 4일부터 9월 10일까지</text><text x="624" y="154" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">하루에 필사한 절 수. 모두 12절,</text><text x="624" y="178" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">하루 평균 1.7절. 가장 많은 날은</text><text x="624" y="202" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">9월 6일 3절, 없는 날은 이틀.」</text><path d="M600 232h520" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="624" y="262" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">막대를 하나씩 훑지 않아도 주간 흐름을</text><text x="624" y="282" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">알 수 있어야 한다. 차트에 요약 문장을</text><text x="624" y="302" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">접근성 레이블로 붙인다.</text><text x="600" y="380" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">차트 텍스트 요약 — 로드맵 §9-2 의 접근성 보완 항목이다.</text></svg>