Apple SD Gothic Neo, sans-serif" text-anchor="end">새기다</text></g><text x="140" y="664" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">본문을 위, 필기를 아래로 둔다 — 공유했을 때 좁은 화면에서도 읽는 순서가 그대로다. 앱 화면의 좌우 2단을 그대로 쓰지 않는 이유다. 이 배치는 제안이다.</text><text x="140" y="688" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">권·장·절과 번역본을 아래에 적는다. 도구 팔레트 · 선택 표시 · 광고는 들어가지 않는다 (로드맵 §3-2).</text><text x="140" y="712" font-size="13" fill="#A4453C" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">위젯에 넣을 때는 같은 그림을 그대로 쓸 수 없다 — WidgetKit 에 면적 상한이 있어 축소 사본이 따로 필요하다.</text></svg>