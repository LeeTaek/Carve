font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">새기다 · 개역한글</text></g><g id="다크 · 반전" data-name="다크 · 반전"><rect x="790" y="80" width="320" height="151" rx="22" fill="#262C29" /><text x="814" y="120" font-size="12" fill="#9AA39C" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">시편 23:1</text><text x="814" y="168" font-size="29.7" fill="#8FB79A" font-family="Nanum Pen Script, Nanum Pen, cursive" data-role="handwriting">여호와는 나의 목자시니</text><path d="M814 180h272" stroke="#3A423D" stroke-width="1" opacity="0.9" /><text x="814" y="220" font-size="11" fill="#9AA39C" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">새기다 · 개역한글</text></g><text x="70" y="291" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">라이트</text><text x="70" y="315" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">종이 배경을 명시 색으로 칠한다.</text><text x="70" y="335" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">칠하지 않으면 다크에서 깨진다.</text><text x="430" y="291" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">다크 · 종이 유지</text><text x="430" y="315" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">어두운 홈 화면 위에 밝은 카드가 뜬다.</text><text x="430" y="335" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">이미지를 한 벌만 만들면 된다.</text><text x="790" y="291" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">다크 · 반전</text><text x="790" y="315" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">홈 화면에 어울린다. 대신 어두운</text><text x="790" y="335" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">사본을 따로 만들어야 한다.</text><text x="70" y="380" font-size="12" fill="#A4453C" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">WIDGET-0 에서 위젯이 앱의 UIUserInterfaceStyle: Light 를 상속하지 않는 것을 확인했다. 둘 중 어느 쪽으로 갈지는 정하지 않았다.</text></svg>