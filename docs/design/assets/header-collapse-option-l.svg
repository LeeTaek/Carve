ll="#303B36" font-family="Noto Serif KR, AppleMyungjo, serif">해를 두려워하지 않을 것은 주께서 나와</text><path d="M620 643h516" stroke="#DFE2DB" /><text x="78" y="678" font-size="20" fill="#303B36" font-family="Noto Serif KR, AppleMyungjo, serif">함께 하심이라 주의 지팡이와 막대기가</text><path d="M620 691h516" stroke="#DFE2DB" /></g><g id="축소 팔레트" data-name="축소 팔레트"><clipPath id="g2102"><path d="M56 742a32 32 0 1 0 64 0a32 32 0 1 0 -64 0z" /></clipPath><use href="#L2" ns1:href="#L2" filter="url(#frost)" clip-path="url(#g2102)" /><path d="M56 742a32 32 0 1 0 64 0a32 32 0 1 0 -64 0z" fill="#F0EFEA" opacity="0.72" /><path d="M56 742a32 32 0 1 0 64 0a32 32 0 1 0 -64 0z" fill="url(#spec)" /><path d="M56 742a32 32 0 1 0 64 0a32 32 0 1 0 -64 0z" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.65" /><path d="M56 742a32 32 0 1 0 64 0a32 32 0 1 0 -64 0z" fill="none" stroke="#303B36" stroke-width="1" opacity="0.10" /><g transform="translate(76 730) scale(1)" fill="none" stroke="#303B36" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><title>펜</title><path d="m4 20 1-5L16 4a2.12 2.12 0 0 1 3 3L8 18l-4 2Zm10-14 4 4M5 15l3 3" /></g><text x="88" y="800" font-size="11" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">펜 · 0.5 mm</text></g><g id="헤더 경계" data-name="헤더 경계"><path d="M28 78h1124" stroke="#476550" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.85" /><rect x="1002" y="64" width="150" height="28" rx="14" fill="#FAF9F6" /><rect x="1002" y="64" width="150" height="28" rx="14" fill="none" stroke="#476550" stroke-width="1.5" /><text x="1077" y="83" font-size="12" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle" font-weight="600">헤더 78pt</text></g><g id="본문 시작" data-name="본문 시작"><path d="M28 150h1124" stroke="#5F6862" stroke-width="1" stroke-dasharray="4 6" opacity="0.55" /><text x="1152" y="144" font-size="11" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="end">본문 시작 — 두 상태 같음</text></g></g><text x="32" y="1788" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">읽어 내려가는 중 — 헤더가 78pt 로 줄고 번역본 이름이 접힌다. 도구 팔레트도 같은 신호로 함께 접힌다. 본문 시작점은 그대로다.</text><g transform="translate(0 1832)"><rect x="0" y="0" width="1180" height="420" rx="24" fill="#F0EFEA" /><rect x="40" y="40" width="1100" height="240" rx="16" fill="#FAF9F6" /><rect x="40" y="40" width="1100" height="240" rx="16" fill="none" stroke="#303B36" stroke-width="1" opacity="0.10" /><text x="64" y="72" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">항목</text><text x="520" y="72" font-size="12" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">펼침</text><text x="800" y="72" font-size="12" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-weight="600">축소</text><path d="M64 88h1052" stroke="#303B36" stroke-width="1" opacity="0.07" /><text x="64" y="112" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">성경 이름</text><text x="520" y="112" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">26pt 명조 · 가운데</text><text x="800" y="112" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">16pt 명조 · 가운데</text><path d="M64 124h1052" stroke="#303B36" stroke-width="1" opacity="0.07" /><text x="64" y="148" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">번역본 이름(개역한글)</text><text x="520" y="148" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">보인다</text><text x="800" y="148" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">접힌다</text><path d="M64 160h1052" stroke="#303B36" stroke-width="1" opacity="0.07" /><text x="64" y="184" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">서재 · 이전 · 다음 · 본문</text><text x="520" y="184" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">44pt 버튼</text><text x="800" y="184" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">44pt 버튼 — 줄만 위로 붙는다</text><path d="M64 196h1052" stroke="#303B36" stroke-width="1" opacity="0.07" /><text x="64" y="220" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">헤더 높이</text><text x="520" y="220" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">118pt</text><text x="800" y="220" font-size="13" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">78pt</text><path d="M64 232h1052" stroke="#303B36" stroke-width="1" opacity="0.07" /><text x="64" y="256" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">본문 시작점</text><text x="520" y="256" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">166pt</text><text x="800" y="256" font-size="13" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">166pt — 바뀌지 않는다</text><text x="40" y="316" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">접힘·펼침은 스크롤 방향을 따른다 — 도구 팔레트와 같은 신호를 쓴다(4-1). 본문을 읽어 내려가면 접히고 되돌리면 펼쳐진다.</text><text x="40" y="340" font-size="13" fill="#A4453C" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">측정 높이는 펼친 상태로 고정하고 그리는 내용만 바꾼다. CarveDetailView 가 헤더 높이를 본문 위 여백과 본문 시작점으로 쓰기 때문이다.</text><text x="40" y="364" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">새로 만드는 것이 아니다. HeaderFeature.headerAnimation 이 이미 스크롤 방향으로 headerOffset 을 움직이고, 쓰이지 않는 showOnlyTitle 상태가 남아 있다.</text></g><text x="32" y="2280" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">두 상태에서 남는 것과, 구현에서 지켜야 할 것.</text></svg>