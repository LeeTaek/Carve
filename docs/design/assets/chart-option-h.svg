nt-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">3</text><text x="874.0" y="466" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">9. 9 화</text><rect x="988.0" y="308.5" width="52" height="127.5" rx="10" fill="#476550"/><rect x="998.0" y="276.5" width="32" height="24" rx="12" fill="#E4EBE2"/><text x="1014.0" y="293.5" font-size="12" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">3</text><text x="1014.0" y="466" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">9. 10 수</text><text x="64" y="226" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">하루에 필사한 절</text></g><g id="요약 타일" data-name="요약 타일"><rect x="40" y="524" width="263" height="236" rx="16" fill="#FAF9F6"/><rect x="40" y="524" width="263" height="236" rx="16" fill="none" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="60" y="554" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">한 주 동안</text><text x="60" y="590" font-size="26" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">12절</text><text x="60" y="624" font-size="11" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">최근</text><text x="60" y="650" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">· 시편 23편 1절</text><text x="60" y="674" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">· 시편 22편 31절</text><text x="60" y="698" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">· 시편 22편 30절</text><rect x="319" y="524" width="263" height="236" rx="16" fill="#FAF9F6"/><rect x="319" y="524" width="263" height="236" rx="16" fill="none" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="339" y="554" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">하루 평균</text><text x="339" y="590" font-size="26" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">1.7절</text><text x="339" y="624" font-size="11" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">최근 장</text><text x="339" y="650" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">· 시편 23편</text><text x="339" y="674" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">· 시편 22편</text><text x="339" y="698" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">· 시편 21편</text><rect x="598" y="524" width="263" height="236" rx="16" fill="#FAF9F6"/><rect x="598" y="524" width="263" height="236" rx="16" fill="none" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="618" y="554" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">가장 많이 쓴 장</text><text x="618" y="590" font-size="22" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">시편 23편</text><text x="618" y="618" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">6절</text><text x="618" y="664" font-size="13" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">이어서 쓰기</text><rect x="877" y="524" width="263" height="236" rx="16" fill="#FAF9F6"/><rect x="877" y="524" width="263" height="236" rx="16" fill="none" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="897" y="554" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">스폰서</text><rect x="897" y="570" width="223" height="150" rx="12" fill="#F0EFEA"/><text x="1008" y="650" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">광고 자리</text><rect x="1086" y="540" width="34" height="18" rx="6" fill="#E4EBE2"/><text x="1103" y="553" font-size="10" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">Ad</text></g></g><text x="32" y="896" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">주 이동을 좌우 버튼과 기간 표시로 드러낸다 — 지금은 가로 드래그만 받아 세로 스크롤을 막는다(CHART). 타일은 「한 주 동안 / 3절 / 필사하셨어요」로 쪼개진 문장을 라벨과 값으로 정리했다.</text><g transform="translate(0 940)"><rect x="0" y="0" width="1180" height="420" rx="24" fill="#F0EFEA"/><rect x="60" y="60" width="480" height="280" rx="20" fill="#FAF9F6"/><rect x="60" y="60" width="480" height="280" rx="20" fill="none" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="300" y="160" font-size="17" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle" font-weight="600">아직 기록이 없어요</text><text x="300" y="192" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">한 절이라도 필사하면 여기에 쌓여요.</text><rect x="220" y="226" width="160" height="44" rx="12" fill="#F0EFEA" opacity="0.72"/><rect x="220" y="226" width="160" height="44" rx="12" fill="none" stroke="#FFFFFF" opacity="0.6"/><text x="300.0" y="253.0" font-size="14" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">필사하러 가기</text><text x="60" y="380" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">빈 상태 — 화면 1/3 을 빈 문장으로 채우지 않고 바로 돌아갈 길을 준다.</text><rect x="600" y="60" width="520" height="280" rx="20" fill="#FAF9F6"/><rect x="600" y="60" width="520" height="280" rx="20" fill="none" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="624" y="94" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">VoiceOver 가 읽는 요약</text><text x="624" y="130" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">「차트. 9월 4일부터 9월 10일까지</text><text x="624" y="154" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">하루에 필사한 절 수. 모두 12절,</text><text x="624" y="178" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">하루 평균 1.7절. 가장 많은 날은</text><text x="624" y="202" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">9월 6일 3절, 없는 날은 이틀.」</text><path d="M600 232h520" stroke="#303B36" stroke-width="1" opacity="0.08"/><text x="624" y="262" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">막대를 하나씩 훑지 않아도 주간 흐름을</text><text x="624" y="282" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">알 수 있어야 한다. 차트에 요약 문장을</text><text x="624" y="302" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">접근성 레이블로 붙인다.</text><text x="600" y="380" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">차트 텍스트 요약 — 로드맵 §9-2 의 접근성 보완 항목이다.</text></g><text x="32" y="1400" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">빈 상태와 접근성 텍스트 요약.</text></svg>