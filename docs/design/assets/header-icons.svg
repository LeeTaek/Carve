ans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">사이드바 하단</text><text x="862" y="344" font-size="11" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">VoiceOver: 필사 기록</text><path d="M950 92v270" stroke="#DFE2DB"/><rect x="1016" y="92" width="44" height="44" rx="12" fill="#F0EFEA" opacity="0.72"/><rect x="1016" y="92" width="44" height="44" rx="12" fill="none" stroke="#FFFFFF" opacity="0.6"/><g transform="translate(1026 102) scale(1)" fill="none" stroke="#303B36" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><title>설정</title><path d="M3 8h3.4M11.6 8H21M3 16h9.4M17.6 16H21"/><circle cx="9" cy="8" r="2.6"/><circle cx="15" cy="16" r="2.6"/></g><g transform="translate(1002 176)"><g transform="translate(0 0) scale(3)" fill="none" stroke="#303B36" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><title>설정</title><path d="M3 8h3.4M11.6 8H21M3 16h9.4M17.6 16H21"/><circle cx="9" cy="8" r="2.6"/><circle cx="15" cy="16" r="2.6"/></g></g><text x="1038" y="300" font-size="14" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">설정</text><text x="1038" y="322" font-size="11" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">사이드바 하단</text><text x="1038" y="344" font-size="11" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">VoiceOver: 설정</text><path d="M32 380h1116" stroke="#DFE2DB"/><text x="56" y="425" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">상태</text><rect x="116" y="398" width="44" height="44" rx="12" fill="#F0EFEA" opacity="0.72"/><rect x="116" y="398" width="44" height="44" rx="12" fill="none" stroke="#FFFFFF" opacity="0.6"/><g transform="translate(126 408) scale(1)" fill="none" stroke="#303B36" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><title>다음 장</title><path d="M5 12h14m-6-6 6 6-6 6"/></g><text x="138" y="460" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">기본</text><rect x="252" y="398" width="44" height="44" rx="12" fill="#E4EBE2"/><rect x="252" y="398" width="44" height="44" rx="12" fill="none" stroke="#476550" opacity="0.45"/><g transform="translate(262 408) scale(1)" fill="none" stroke="#476550" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><title>다음 장</title><path d="M5 12h14m-6-6 6 6-6 6"/></g><text x="274" y="460" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">눌림 · 열림</text><rect x="388" y="398" width="44" height="44" rx="12" fill="#F0EFEA" opacity="0.72"/><rect x="388" y="398" width="44" height="44" rx="12" fill="none" stroke="#FFFFFF" opacity="0.6"/><g transform="translate(398 408) scale(1)" fill="none" stroke="#DFE2DB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><title>다음 장</title><path d="M5 12h14m-6-6 6 6-6 6"/></g><text x="410" y="460" font-size="12" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle">비활성</text><text x="560" y="418" font-size="13" fill="#303B36" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">비활성은 창세기 1장의 「이전 장」, 계시록 22장의 「다음 장」이다.</text><text x="560" y="440" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">색만으로 구분하지 않도록 눌림 상태는 배경까지 바뀐다.</text><text x="32" y="520" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">「서재」는 성경 목록을 여는 사이드바 토글이라 책 아이콘 대신 사이드바 아이콘을 썼다. 책 아이콘은 「무엇을 여는가」를, 사이드바 아이콘은 「어디가 열리는가」를 말한다 — iPad 사용자에게는 뒤쪽이 익다.</text><text x="32" y="544" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">「본문 설정」만 선 아이콘이 아니라 글자다. Safari 의 aA 에 대응하는 한글판으로 큰 가·작은 가를 겹쳐 뒀다. 선 아이콘으로 바꾸려면 글자 크기를 뜻하는 그림을 새로 정해야 한다.</text><text x="32" y="568" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">사이드바 하단의 「개역한글」은 동작이 아니라 현재 값이라 글자로 남겼다. 아이콘은 어떤 번역본인지 말할 수 없다.</text><text x="32" y="592" font-size="13" fill="#5F6862" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">「서재」·「본문 설정」은 라벨 없이 아이콘만 두기로 했다 (2026-09-10). 올가미 식별성은 남아 있다.</text><text x="32" y="616" font-size="12" fill="#476550" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">낱장 파일: library.svg · prev.svg · next.svg · textformat.svg · chart.svg · settings.svg</text></svg>